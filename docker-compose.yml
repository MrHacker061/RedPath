services:
  api:
    build: .
    image: redpath-api
    environment:
      REDPATH_PORT: ${REDPATH_PORT:-8000}
      REDPATH_LOG_LEVEL: ${REDPATH_LOG_LEVEL:-INFO}
      # Ollama runs on the host computer, not in this container. RedPath accepts
      # this address only because the container marker (/.dockerenv) exists here;
      # see CONTAINER_MARKERS in redpath_ai/providers.py.
      REDPATH_OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      # Docker Desktop already provides this name; Docker on Linux needs it added.
      - "host.docker.internal:host-gateway"
    ports:
      # Host loopback only, with matching ports: the request guard checks Host: 127.0.0.1:<port>.
      - "127.0.0.1:${REDPATH_PORT:-8000}:${REDPATH_PORT:-8000}"
    volumes:
      - redpath-data:/data

volumes:
  redpath-data:
