[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "redpath"
version = "0.1.0"
description = "Local-first learning platform for authorized cybersecurity labs"
requires-python = ">=3.11"
dependencies = ["defusedxml>=0.7,<1", "fastapi>=0.116,<1", "pydantic-settings>=2.10,<3", "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.35,<1"]

[project.scripts]
redpath-api = "redpath.__main__:main"

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.4,<10"]

[tool.setuptools.packages.find]
include = ["redpath*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
